<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* One reading column (68ch) that widens for diffs; chapters run top to bottom, core first.
   Diff colors and the read/skim/skip tiers are semantic; the accent is ink blue. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#E8ECF0; --ink:#17212B; --muted:#5B6876; --line:#D6DDE4;
  --accent:#2B4FC7; --accent-soft:#E2E8FA;
  --add:#1B7A4B; --add-bg:#E3F4EA; --del:#B23A2A; --del-bg:#FBE6E2; --hh:#5B6876; --hh-bg:#EDF0F4;
  --read:#B23A2A; --read-soft:#FBE6E2; --skim:#9A6511; --skim-soft:#FAEDD6; --skip:#5B6876; --skip-soft:#E8ECF0;
  --display:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1419; --surface:#151D24; --sunk:#1C262F; --ink:#E3EAF0; --muted:#8E9DAB; --line:#28343F;
  --accent:#8EA6FF; --accent-soft:#1F2B4B;
  --add:#5CC98F; --add-bg:#14301F; --del:#F08472; --del-bg:#3A1C17; --hh:#8E9DAB; --hh-bg:#1A232B;
  --read:#F08472; --read-soft:#3A1C17; --skim:#E6AC55; --skim-soft:#3A2B13; --skip:#8E9DAB; --skip-soft:#1C262F;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1419; --surface:#151D24; --sunk:#1C262F; --ink:#E3EAF0; --muted:#8E9DAB; --line:#28343F;
  --accent:#8EA6FF; --accent-soft:#1F2B4B;
  --add:#5CC98F; --add-bg:#14301F; --del:#F08472; --del-bg:#3A1C17; --hh:#8E9DAB; --hh-bg:#1A232B;
  --read:#F08472; --read-soft:#3A1C17; --skim:#E6AC55; --skim-soft:#3A2B13; --skip:#8E9DAB; --skip-soft:#1C262F;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 72px}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
code{font:.88em var(--mono)}
.story{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.story>*{width:100%;max-width:68ch;margin-inline:auto}
.story>.chapter,.story>.pr-group{max-width:980px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:600 clamp(28px,5vw,40px)/1.15 var(--display);letter-spacing:-.01em}
h2{font:600 24px/1.25 var(--display)}
h3{font:600 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.eyebrow{font:500 13px var(--mono);color:var(--muted);margin:0}
.meta{font:13px var(--mono);color:var(--muted);margin:0;font-variant-numeric:tabular-nums}
.plus{color:var(--add)} .minus{color:var(--del)}

.cover{display:flex;flex-direction:column;gap:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.summary{font-size:19px;line-height:1.55;margin:0}
.toc{margin:4px 0 0;padding:0;list-style:none;counter-reset:ch;display:flex;flex-direction:column;gap:2px}
.toc li{counter-increment:ch}
.toc a{display:grid;grid-template-columns:2.2em 4.4em 1fr;align-items:baseline;gap:8px;padding:7px 8px;border-radius:6px;color:var(--ink);text-decoration:none}
.toc a::before{content:counter(ch);font:500 13px var(--mono);color:var(--muted);text-align:right}
.toc a:hover{background:var(--sunk)}
.legend{font-size:13px;color:var(--muted);margin:0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.qcount{margin:0;font-weight:500}

.pill{font:500 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:4px;justify-self:start;white-space:nowrap}
.pill.tier-read{color:var(--read);background:var(--read-soft)}
.pill.tier-skim{color:var(--skim);background:var(--skim-soft)}
.pill.tier-skip{color:var(--skip);background:var(--skip-soft)}

.pr-head{display:flex;flex-direction:column;gap:6px;padding-top:12px}
.pr-head h2{font-size:20px}

.chapter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:16px;min-width:0;scroll-margin-top:16px}
.chapter>:not(.refs){max-width:68ch}
.chapter.tier-skip{background:transparent}
.ch-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ch-num{font:500 13px var(--mono);color:var(--muted)}
.ch-pr{font:13px var(--mono);color:var(--muted)}
.what{margin:0;font-size:17px}
.why{display:flex;flex-direction:column;gap:8px;padding:14px 16px;background:var(--sunk);border-radius:8px}
.why p{margin:0}
.why.missing p{color:var(--muted);font-style:italic}
.sources{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.src-kind{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:4px}
.sources q{color:var(--muted);font-style:italic}
.ask{margin:0;display:flex;flex-direction:column;gap:4px;padding:12px 16px;border:1px dashed var(--skim);border-radius:8px}
.ask span{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--skim)}

.refs{display:flex;flex-direction:column;gap:14px;min-width:0}
.file{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.file figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:8px 12px;background:var(--sunk);font:13px var(--mono)}
.path{font-weight:500;word-break:break-all}
.delta{color:var(--muted)}
.omitted{margin:0;padding:12px;color:var(--muted);font-size:14px}
.hunk{margin:0;overflow-x:auto;max-height:520px;overflow-y:auto;font:13px/1.5 var(--mono);background:var(--surface)}
.hunk code{display:block;min-width:max-content}
.hunk+.hunk{border-top:1px solid var(--line)}
.ln{display:block;padding-inline:12px;white-space:pre}
.ln.add{background:var(--add-bg);color:var(--add)}
.ln.del{background:var(--del-bg);color:var(--del)}
.ln.hh{background:var(--hh-bg);color:var(--hh)}
.ln.more{color:var(--muted);font-style:italic}

.questions{display:flex;flex-direction:column;gap:10px;padding:20px 0;border-top:1px solid var(--line)}
.questions ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.questions .hint{margin:0;color:var(--muted)}
.question a{font:500 13px var(--mono);margin-right:6px}
.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

/* timeline: one rail of real events per PR, chapters collapsed beneath it */
.pr-group{display:flex;flex-direction:column;gap:16px}
.rail{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px;max-width:68ch}
.ev{position:relative;display:grid;grid-template-columns:8.5em 1fr;gap:10px;font-size:14px}
.ev::before{content:"";position:absolute;left:-24px;top:.45em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.ev time{font:13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ev.open::before,.ev.merged::before{background:var(--accent);border-color:var(--accent)}
.ev.r-approved::before{background:var(--add);border-color:var(--add)}
.ev.r-changes_requested::before{background:var(--read);border-color:var(--read)}
.ev.commit span{font-family:var(--mono);font-size:13px}
@media (max-width:520px){.ev{grid-template-columns:1fr;gap:0}}

/* slides: one chapter per screen */
[data-format="slides"] .slide:not(.on),[data-format="slides"] .pr-head{display:none}
[data-format="slides"]{padding-bottom:64px}
#slide-nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:16px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--surface);border-top:1px solid var(--line);max-width:none}
#slide-nav button{font:500 14px var(--sans);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer}
#slide-nav button:disabled{opacity:.4;cursor:default}
#slide-pos{font:13px var(--mono);color:var(--muted);min-width:5em;text-align:center}
@media (prefers-reduced-motion:no-preference){.chapter{transition:border-color .15s}}
</style>
{{BODY}}
<script>
(() => {
  const story = document.querySelector('.story');
  if (!story || story.dataset.format !== 'slides') return;
  const slides = [...story.querySelectorAll('.slide')];
  const pos = document.getElementById('slide-pos'), prev = document.getElementById('prev'), next = document.getElementById('next');
  let i = 0;
  const show = (n, push) => {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle('on', k === i));
    pos.textContent = (i + 1) + ' / ' + slides.length;
    prev.disabled = i === 0; next.disabled = i === slides.length - 1;
    if (push && slides[i].id) history.replaceState(null, '', '#' + slides[i].id);
    window.scrollTo(0, 0);
  };
  const fromHash = () => { const k = slides.findIndex(s => '#' + s.id === location.hash); show(k < 0 ? 0 : k); };
  prev.addEventListener('click', () => show(i - 1, true));
  next.addEventListener('click', () => show(i + 1, true));
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') show(i + 1, true);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(i - 1, true);
  });
  story.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]'); if (!a) return;
    const k = slides.findIndex(s => '#' + s.id === a.getAttribute('href'));
    if (k >= 0) { e.preventDefault(); show(k, true); }
  });
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
