# Generated by flow-stack make-routines from .github/routines/@NAME@.md.
# Edit that file, then re-render: routines.sh render
name: flow @NAME@
on:
@ON@
concurrency:
  group: flow-@NAME@@GROUP@
  cancel-in-progress: @CANCEL@
permissions:
  contents: @PERM_contents@
  issues: @PERM_issues@
  pull-requests: @PERM_pull_requests@
  id-token: write
jobs:
  run:
@IF@
    runs-on: ubuntu-latest
    timeout-minutes: @TIMEOUT@
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: flow-stack home and labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/flow-stack"
          cp .github/routines/profile.md "$RUNNER_TEMP/flow-stack/profile.md"
          echo "FLOW_STACK_HOME=$RUNNER_TEMP/flow-stack" >>"$GITHUB_ENV"
          for l in @LABELS@; do gh label create "$l" --force >/dev/null; done
@CLONE@
      # A fresh runner installs the plugin on every run: the marketplace's default branch, or the clone pinned above
      - uses: anthropics/claude-code-action@v1
        with:
          @AUTH@
          @TOKEN@
          plugin_marketplaces: @MARKET@
          plugins: flow-stack@flow-stack
          prompt: |
            @MODE@ Run the routine in .github/routines/@NAME@.md. Follow it exactly.@CTX@
          claude_args: --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Agent,Skill,TodoWrite"
      # The runner's disk is thrown away, so show whatever the run queued in GATES.md before it is lost
      - name: Open gates
        if: always()
        run: |
          for g in .flow/GATES.md .flow/tasks/*/GATES.md; do [ -f "$g" ] || continue; { echo "### $g"; cat "$g"; } >>"$GITHUB_STEP_SUMMARY"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-gates
          path: |
            .flow/GATES.md
            .flow/tasks/*/GATES.md
          if-no-files-found: ignore
