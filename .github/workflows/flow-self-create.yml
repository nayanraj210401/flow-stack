# Generated by flow-stack make-routines from .github/routines/self-create.md.
# Edit that file, then re-render: routines.sh render
name: flow self-create
on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
concurrency:
  group: flow-self-create
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write
jobs:
  run:

    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: flow-stack home and labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/flow-stack"
          cp .github/routines/profile.md "$RUNNER_TEMP/flow-stack/profile.md"
          echo "FLOW_STACK_HOME=$RUNNER_TEMP/flow-stack" >>"$GITHUB_ENV"
          for l in self-create reproducible; do gh label create "$l" --force >/dev/null; done

      # A fresh runner installs the plugin on every run: the marketplace's default branch, or the clone pinned above
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: https://github.com/nayanraj210401/flow-stack.git
          plugins: flow-stack@flow-stack
          prompt: |
            --auto Run the routine in .github/routines/self-create.md. Follow it exactly.
          claude_args: --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Agent,Skill,TodoWrite"
