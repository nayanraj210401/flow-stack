# Generated by flow-stack make-routines from .github/routines/self-heal.md.
# Edit that file, then re-render: routines.sh render
name: flow self-heal
on:
  schedule:
    - cron: "30 23 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
concurrency:
  group: flow-self-heal
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  run:

    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: flow-stack home and labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/flow-stack"
          cp .github/routines/profile.md "$RUNNER_TEMP/flow-stack/profile.md"
          echo "FLOW_STACK_HOME=$RUNNER_TEMP/flow-stack" >>"$GITHUB_ENV"
          for l in self-heal heal-ok needs-repro; do gh label create "$l" --force >/dev/null; done

      # A fresh runner installs the plugin on every run: the marketplace's default branch, or the clone pinned above
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
          plugin_marketplaces: https://github.com/nayanraj210401/flow-stack.git
          plugins: flow-stack@flow-stack
          prompt: |
            /flow-stack:flow --auto ship Run the routine in .github/routines/self-heal.md. Follow it exactly.
          claude_args: --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Agent,Skill,TodoWrite"
      # The runner's disk is thrown away, so show whatever the run queued in GATES.md before it is lost
      - name: Open gates
        if: always()
        run: |
          for g in .flow/GATES.md .flow/tasks/*/GATES.md; do [ -f "$g" ] || continue; { echo "### $g"; cat "$g"; } >>"$GITHUB_STEP_SUMMARY"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-gates
          path: |
            .flow/GATES.md
            .flow/tasks/*/GATES.md
          if-no-files-found: ignore
