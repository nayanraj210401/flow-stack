# Generated by flow-stack make-routines from .github/routines/ideate.md.
# Edit that file, then re-render: routines.sh render
name: flow ideate
on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
concurrency:
  group: flow-ideate
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
  id-token: write
jobs:
  run:
    if: vars.FLOW_FACTORY != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: flow-stack home and labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/flow-stack"
          cp .github/routines/profile.md "$RUNNER_TEMP/flow-stack/profile.md"
          echo "FLOW_STACK_HOME=$RUNNER_TEMP/flow-stack" >>"$GITHUB_ENV"
          # the routine's labels must exist (names match case-insensitively, as on GitHub); an existing one is never
          # edited. A missing one stops the run, unless the routine sets create_labels: true.
          labels="proposal accept" miss=""
          if [ -n "$labels" ]; then
            have="$(gh label list --limit 1000 --json name --jq '.[].name')"
            for l in $labels; do
              grep -qixF "$l" <<<"$have" && continue
              if [ false = true ]; then gh label create "$l" >/dev/null || echo "label $l not created"
              else echo "label $l missing: create it, map yours in .github/routines/labels.tsv, or set create_labels: true" | tee -a "$GITHUB_STEP_SUMMARY"; miss=1; fi
            done
          fi
          [ -z "$miss" ]
      # A fresh runner installs the plugin on every run: the marketplace's default branch, or the clone pinned above
      - uses: anthropics/claude-code-action@v1
        id: claude
        continue-on-error: true
        # The action's SDK session ends when the agent ends its turn, so a subagent left running in the background
        # (the reviewer, a worker) is dropped and its result never used. Foreground subagents return in the same turn.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: https://github.com/nayanraj210401/flow-stack.git
          plugins: flow-stack@flow-stack
          prompt: |
            --auto Run the routine in .github/routines/ideate.md. Follow it exactly.
          claude_args: --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Agent,Skill,TodoWrite"
      # The action hides the run's output, and this repo's logs may be public. The trace shows what the run did
      # (each tool call's input, the run's own words, and the first 160 characters of a failed tool's error) but no
      # other tool output, where a secret would surface. Known token shapes are masked before any line is cut short.
      - name: Trace
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          RUN_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$RUN_FILE" ] || exit 0
          { echo "### What the run did"; echo '```'
            jq -rs 'if length == 1 and (.[0] | type) == "array" then .[0][] else .[] end | (select(.type == "assistant") | .message.content[]? |
                if .type == "tool_use" then "\(.name): \(.input | .command // .file_path // .pattern // .skill // .description // . | tostring | gsub("\n"; " "))"
                elif .type == "text" then "say: \(.text | gsub("\n"; " "))" else empty end),
              (select(.type == "user") | .message.content[]? | select(.type? == "tool_result" and .is_error == true) |
                "error: \(.content | tostring | gsub("\n"; " "))"),
              (select(.type == "result") | "result: \(.subtype) turns=\(.num_turns) cost=$\(.total_cost_usd) denied=\(.permission_denials_count // (.permission_denials | length))")' "$RUN_FILE" |
              perl -pe 's/(sk-ant-[a-z]+[0-9]*-|sk-|gh[opsu]_|github_pat_)[A-Za-z0-9_.-]{8,}/$1REDACTED/g; s/(bearer\s+|token[=:]\s*)[A-Za-z0-9._~+\/=-]{8,}/$1REDACTED/gi; chomp; $_ = substr($_, 0, /^error: / ? 160 : 300) . "\n"'
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      # The runner's disk is thrown away, so show whatever the run queued in GATES.md before it is lost
      - name: Open gates
        if: always()
        run: |
          for g in .flow/GATES.md .flow/tasks/*/GATES.md; do [ -f "$g" ] || continue; { echo "### $g"; cat "$g"; } >>"$GITHUB_STEP_SUMMARY"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-gates
          path: |
            .flow/GATES.md
            .flow/tasks/*/GATES.md
          if-no-files-found: ignore
      # A usage limit is not a verdict: the summary says the run was stopped by it and the job ends green, so a re-run
      # after the reset picks it up. Any other failure of the agent still fails the job.
      - name: Outcome
        if: always() && steps.claude.outcome == 'failure'
        env:
          RUN_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          # only the first line of the run's last assistant words counts, and only Claude's own limit message:
          # "You've hit your 5-hour limit · resets 11:20am (UTC)" or "Claude AI usage limit reached|<epoch>"
          said="$(jq -rs '[if length == 1 and (.[0] | type) == "array" then .[0][] else .[] end | select(.type == "assistant")
            | .message.content[]? | select(.type == "text") | .text] | last // ""' "$RUN_FILE" 2>/dev/null | head -n 1)"
          if grep -qiE "^You.{1,3}ve hit your [^·]{0,40}limit · resets |^Claude AI usage limit reached\|[0-9]+$" <<<"$said"; then
            resets="$(grep -oiE 'resets .*' <<<"$said")"
            echo "### Stopped by a Claude usage limit${resets:+ ($resets)}. Anything it pushed stays; re-run after the reset." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1
