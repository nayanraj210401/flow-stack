# The script tests on every PR: the check the auto-merge routine and branch protection require.
# Read-only token and no secrets, so a PR's own test code runs here without anything to steal.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        # factory.test.sh compares the hooks with origin/main's
        with:
          fetch-depth: 0
      # holds.test.sh builds the herdr band mod (register.tsx) with bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: script tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          fail=0
          for t in $(git ls-files 'plugins/**/*.test.sh' | grep -v '/herdr/'); do
            if out="$(bash "$t" 2>&1)"; then echo "ok   $t"; else echo "FAIL $t"; echo "$out" | tail -20; fail=1; fi
          done
          exit "$fail"
  # Each test a PR adds must fail on the base's code: a test that already passes there can't stand in for one, so
  # a no-op test file never unlocks an unattended merge. The script comes from the base, so a PR can't weaken it.
  red-on-base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: new tests fail on the base
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          s="$RUNNER_TEMP/routines.sh"
          git show "origin/$BASE:plugins/flow-stack/skills/make-routines/scripts/routines.sh" >"$s"
          if ! grep -q '^redbase()' "$s"; then echo "the base predates redbase: nothing to check"; exit 0; fi
          bash "$s" redbase --ref "origin/$BASE"
