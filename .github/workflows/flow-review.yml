# Generated by flow-stack make-routines from .github/routines/review.md.
# Edit that file, then re-render: routines.sh render
name: flow review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
concurrency:
  group: flow-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
  pull-requests: write
  checks: read
  id-token: write
jobs:
  run:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: flow-stack home and labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/flow-stack"
          cp .github/routines/profile.md "$RUNNER_TEMP/flow-stack/profile.md"
          echo "FLOW_STACK_HOME=$RUNNER_TEMP/flow-stack" >>"$GITHUB_ENV"
          for l in ; do gh label create "$l" --force >/dev/null; done
      - name: flow/ready
        id: stamp
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          n="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=flow/ready" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success" and .output.title == "ready.sh stamped this commit")] | length' 2>/dev/null || true)"
          [ "${n:-0}" -gt 0 ] 2>/dev/null || exit 0
          echo skip=true >>"$GITHUB_OUTPUT"
          echo "### ${SHA:0:7} has a passing flow/ready check: it was reviewed when it was stamped" >>"$GITHUB_STEP_SUMMARY"
      # A fresh runner installs the plugin on every run: the marketplace's default branch, or the clone pinned above
      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.stamp.outputs.skip != 'true'
        # The action's SDK session ends when the agent ends its turn, so a subagent left running in the background
        # (the reviewer, a worker) is dropped and its result never used. Foreground subagents return in the same turn.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: https://github.com/nayanraj210401/flow-stack.git
          plugins: flow-stack@flow-stack
          prompt: |
            --auto Run the routine in .github/routines/review.md. Follow it exactly. The pull request is #${{ github.event.pull_request.number }}.
          claude_args: --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Agent,Skill,TodoWrite"
      # The action hides the run's output, and this repo's logs may be public. The trace shows what the run did
      # (each tool call's input, the run's own words, and the first 160 characters of a failed tool's error) but no
      # other tool output, where a secret would surface. Known token shapes are masked before any line is cut short.
      - name: Trace
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          RUN_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$RUN_FILE" ] || exit 0
          { echo "### What the run did"; echo '```'
            jq -rs 'if length == 1 and (.[0] | type) == "array" then .[0][] else .[] end | (select(.type == "assistant") | .message.content[]? |
                if .type == "tool_use" then "\(.name): \(.input | .command // .file_path // .pattern // .skill // .description // . | tostring | gsub("\n"; " "))"
                elif .type == "text" then "say: \(.text | gsub("\n"; " "))" else empty end),
              (select(.type == "user") | .message.content[]? | select(.type? == "tool_result" and .is_error == true) |
                "error: \(.content | tostring | gsub("\n"; " "))"),
              (select(.type == "result") | "result: \(.subtype) turns=\(.num_turns) cost=$\(.total_cost_usd) denied=\(.permission_denials_count // (.permission_denials | length))")' "$RUN_FILE" |
              perl -pe 's/(sk-ant-[a-z]+[0-9]*-|sk-|gh[opsu]_|github_pat_)[A-Za-z0-9_.-]{8,}/$1REDACTED/g; s/(bearer\s+|token[=:]\s*)[A-Za-z0-9._~+\/=-]{8,}/$1REDACTED/gi; chomp; $_ = substr($_, 0, /^error: / ? 160 : 300) . "\n"'
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      # The runner's disk is thrown away, so show whatever the run queued in GATES.md before it is lost
      - name: Open gates
        if: always()
        run: |
          for g in .flow/GATES.md .flow/tasks/*/GATES.md; do [ -f "$g" ] || continue; { echo "### $g"; cat "$g"; } >>"$GITHUB_STEP_SUMMARY"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-gates
          path: |
            .flow/GATES.md
            .flow/tasks/*/GATES.md
          if-no-files-found: ignore
